<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>회원가입 페이지</title>
</head>

<body>

    <h1 style="text-align:center; color:green; font-size:40px;">회원가입</h1>

    <form>

        아이디: <input type="text" name="userid">
        <br>

        비밀번호: <input type="password" name="password">
        <br>

        재확인: <input type="password" name="password2">
        <br>

        이름: <input type="text">
        <br>

        남자<input type="radio" name="gender">
        여자<input type="radio" name="gender">
        <br>
        <br>

        생년월일<br>
        연도 <input type="number" size="11">
        월
        <select>
            <option>1월</option>
            <option>2월</option>
            <option>3월</option>
            <option>4월</option>
            <option>5월</option>
            <option>6월</option>
            <option>7월</option>
            <option>8월</option>
            <option>9월</option>
            <option>10월</option>
            <option>11월</option>
            <option>12월</option>
        </select>
        일 <input type="number" size="5">
        <br>

        휴대폰번호 <input type="text"> <input type="button" value="인증">
        인증번호 <input type="text"> <input type="button" value="확인">
        <br>
        <br>

        <input type="submit" value="가입하기">

    </form>

</body>

</html>
