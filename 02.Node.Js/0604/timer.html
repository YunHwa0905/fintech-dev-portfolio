<html>
<head>
    <title>timer</title>
</head>
<body>
   timer
</body>

<script src="http://code.jquery.com/jquery-latest.min.js"></script>
<script>
    setTimeout(function(){
        console.log("1초");
    }, 1000);

    setTimeout(function(){
        console.log("2초");
    }, 2000);

    setTimeout(function(){
        console.log("3초");
    }, 3000);

    let twoSecInterval = setInterval(function(){
        console.log("2초");
    }, 2000);

    setTimeout(function(){
        clearInterval(twoSecInterval)
    }, 5000)
</script>
</html>
