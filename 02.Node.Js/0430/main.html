<!DOCTYPE html>
<html>
<head>
    <title>ajax</title>
</head>
<body>
    <input type="text" id="num1" placeholder="num1">
    <input type="text" id="num2" placeholder="num2">
    <input type="text" id="num3" placeholder="num3">
    <button id="btn">전송</button>

    <div id="result"></div>
</body>

<script src="http://code.jquery.com/jquery-latest.min.js"></script>
<script>
    $('#btn').click(function () {
        $.ajax({
            url: '/mul3',
            data: {
                num1: $('#num1').val(),
                num2: $('#num2').val(),
                num3: $('#num3').val()
            },
            success: function (data) {
                console.log(data);
                $('#result').text(data);
            }
        });
    });
</script>
</html>
