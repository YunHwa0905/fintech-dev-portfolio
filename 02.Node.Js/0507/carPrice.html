<!DOCTYPE html>
<html>
<head>
    <title>ajax</title>
</head>
<body>
    <select name ="차종" id="car">
        <option value="0">현대</option>
        <option value="1">기아</option>
        <option value="2">쌍용</option>
        <option value="3">밴츠</option>
        <option value="4">BMW</option>
    </select>

    <select name ="색상" id="color">
        <option value="0">빨강</option>
        <option value="1">파랑</option>
        <option value="2">초록</option>
        <option value="3">노랑</option>
        <option value="4">검정</option>
    </select>

    <button id="btn">요청</button>
    <br>
    <span id = "result"></span>

    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script>
        $('#btn').click(function () {
            $.ajax({
                url: `/getPrice?car=${$("#car").val()}&color=${$("#color").val()}`,
                data: {
                },
                success: function (data) {
                    console.log(data);
                    $('#result').html(`${data}만원`);
                }
            });
        });
    </script>

</body>
</html>
