<script>
    const func1 = function(startNumber){
        console.log(`${startNumber}~${startNumber+9} 랜덤 숫자는 : ${Math.floor(Math.random()*10+startNumber)} 입니다.`);
        return startNumber;
    
    }

    let num1 = 3*4;
    let num2 = func1(2);
    let num3 = console.log("condole test");

    console.log(num1, num2, num3);
    //console.log(`${1}~${20} 랜덤 숫자는 : ${Math.floor(Math.random()*10+1)} 입니다.`);


    const power1 = function(num){
        console.log(num*num);
    }

    const power2 = function(num){
        return num*num;
    }

    console.log(power1(10));
    console.log(power2(10));
</script>
