<html>
    <head>
        <title></title>
    </head>
    <body>
        <div id = "upArea">up</div>
        <input type="text" id="inputTxt" placeholder="미리보기 없음"><br>
        <input type="button" value="앞" id ="frontBtn">
        <input type="button" value="뒤" id ="backBtn">
        <div id="downArea">down</div>
    </body>
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script>
        // console.log(document.getElementById("inputTxt").value);
        // console.log($("#inputTxt").val());

         $("#inputTxt").on("keyup", function () {
            let txt = $("#inputTxt").val();

            if (txt === "") {
                $("#upArea").html("미리보기 없음");
                $("#upArea").css("color", "black");
            } else {
             $("#upArea").html(txt);

             if (txt.length >= 10) {
                  $("#upArea").css("color", "red");
             } else {
                  $("#upArea").css("color", "black");
             }
         }
     });

        $("#backBtn").click(function () {
            $("#downArea").html($("#inputTxt").val());
        });

        
    </script>
</html>
