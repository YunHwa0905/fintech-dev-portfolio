<!DOCTYPE html>
<html lang="en">
<head>
    
    
      
</head>

<body>
    <div id="result"></div>
   
</body>
<script src="http://code.jquery.com/jquery-latest.min.js"></script>
<script>
    let sec = 0;

    function dataValues(){
        $.ajax({
            url: '/stock?code=005930',
            success: function(data) {
                $('#result').text(data.price + ' ' + sec);
                sec++;
            }
        })
    }

    setInterval(function(){
        dataValues(); 
    }, 1000);

</script>
</html>
