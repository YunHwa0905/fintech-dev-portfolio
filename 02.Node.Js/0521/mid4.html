<html>
    <head>
        <title></title>
    </head>
    <body>
        <input type="text" id="ko" placeholder="국어 점수를 입력하시오">
        <input type="text" id="en" placeholder="영어 점수를 입력하시오">
        <input type="text" id="ma" placeholder="수학 점수를 입력하시오">
        <input type="button" id="btn" value="확인">
        <br>
        <span id="result"></span>
    </body>
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script>

        $('#btn').click(function(){
            $.ajax({
                url: 'getScore',
                data: {
                    ko: $("#ko").val(),
                    en: $("#en").val(),
                    ma: $("#ma").val()
                },
                success: function(data){
                    $('#result').html(`${data}`);
                }
            })
        })
        

    </script>
</html>
