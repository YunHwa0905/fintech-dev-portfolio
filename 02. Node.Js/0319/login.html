<html>
    <head>
        <title>Document</title>
    </head>
    <body>
        <input type = "text" placeholder="ID를 입력하시오" id = "textId">
        <input type = "password" placeholder="비밀번호를 입력하시오" id = "textPwd">
        <input type = "button" value="입력" id = "btn">
        <br>
    </body>
    <script>
        let idInput = document.getElementById("textId");
        let pwdInput = document.getElementById("textPwd");
        let Btn = document.getElementById("btn");

        function login(){
            if(idInput.value == "polytech" && pwdInput.value == "12341234"){
                console.log("로그인 성공");
            }
            else{
                console.log("로그인 실패");{
                }
                
            }
        }

        Btn.addEventListener('click',login);

        idInput.addEventListener('keydown', function(e){
            if(e.key == 'Enter'){
                pwdInput.focus();
            }
        });

        pwdInput.addEventListener('keydown',function(e){
            if(e.key == 'Enter'){
                login();
            }
        });
    </script>
</html>
