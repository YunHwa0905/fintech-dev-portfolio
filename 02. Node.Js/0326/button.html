<html>
    <head>
        <title></title>
    </head>
    <body>
        <span id ="textOutput"> 
        </span>
    </body>
    <script>


        result = ""
        for(let i=1; i<=100; i++){
            result += `<input type="button" value="${i}">`;
            if(i%10==0){
                result += `<br>`;
            }
            document.getElementById("textOutput").innerHTML = result;
        }
        
        
        
    </script>
</html>
